[Application]
start = True
seconds = 5

[Elasticsearch]
host = localhost
login = talendlog_internal
password = change-me (or set the ELASTICSEARCH_PASSWORD environment variable)
port = 9200
scheme = http
; With scheme = https (recommended off this machine: the login travels with every request), the server
; certificate is verified. For a certificate from a private CA, set the CA certificate's path here.
ca_certs =
http_compress = True

[TalendLogFiles]
path = D:\/TalendRemoteEngine\/TalendJobServersFiles\/jobexecutions\/logs\/
resuming_mask = *_*/resuming_*.log
stdoutErr_mask = *_*/stdOutErr_*.log
task_mask = */*-*-*-*-*.log
